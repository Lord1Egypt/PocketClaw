org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# The Flutter Gradle plugin clears defaultConfig.ndk.abiFilters after
# evaluation and substitutes armeabi-v7a, arm64-v8a and x86_64, overriding the
# arm64-v8a-only filter in app/build.gradle.kts. This property is its only
# opt-out. PocketClaw's Core, Managed Runtime and Flutter engine exist for
# arm64-v8a alone, so any other ABI directory is an APK that installs and then
# cannot start.
disable-abi-filtering=true
