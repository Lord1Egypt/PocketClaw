# The official PocketClaw Telegram managed-bot onboarding service.
#
# This is PUBLIC configuration, not a secret. It is the base URL of the
# PocketClaw-owned deployment of `services/telegram-onboarding`. The manager
# bot token, the webhook secret and the pairing secret are server-side only and
# must never be compiled into the app.
#
# It is tracked here, and the canonical builder reads it, because the previous
# arrangement was a human remembering to type a `--dart-define` on every
# release. That failed exactly the way it was always going to: builds vc34-vc47
# and vc54 carried the URL, vc51-vc53 and everything from vc55 onward did not,
# and the managed onboarding flow silently disappeared from the product with no
# build failing and no test noticing. The feature itself was never broken --
# it was verified end to end on a device at 0.1.3 -- so what shipped was a
# working implementation that the build simply stopped reaching.
#
# A production build now carries this value automatically and then proves it is
# in the finished APK. A build command is a claim; `lib/arm64-v8a/libapp.so` is
# the evidence. See tool/build_hardened_android.py.
#
# Local-test, F-Droid and downstream builds may omit or override it explicitly
# by build class -- they are different products with different services, and
# nothing here guesses an endpoint on their behalf.
#
# Changing this line repoints every subsequent official build. It must stay
# https with a real host; the builder refuses anything else rather than
# downgrading the pairing poll and the one-time bot token onto plaintext.
officialOnboardingBaseUrl=https://pocketclaw-telegram-setup-bot-83ai.vercel.app
