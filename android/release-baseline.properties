# The last versionCode that was physically accepted on a device.
#
# This is the floor the build enforces: pubspec.yaml's versionCode, and any
# -PversionCode override, must be greater than or equal to it. Android refuses
# to install a lower versionCode over a higher one, so a build below this line
# is one that cannot update the installation it is meant to replace.
#
# It advances by hand, once, at the moment a build passes physical acceptance —
# the same commit that records that acceptance in PROJECT_STATE.md. That keeps
# the floor meaningful as the product moves: a permanent 55 would still wave
# through 56 long after 120 had shipped.
#
# It is deliberately not derived from git tags, releases or a build database.
# One tracked number, advanced with the acceptance it records.
lastAcceptedVersionCode=58
