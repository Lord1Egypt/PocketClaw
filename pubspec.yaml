name: pocketclaw
description: "A private AI agent that runs on your Android device — on-device gateway, bundled arm64 tooling, and a local web dashboard."
publish_to: "none"
version: 0.2.1+63

environment:
  sdk: ^3.11.3

dependencies:
  animations: 2.1.2
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  package_info_plus: ^8.1.3
  provider: ^6.1.5+1
  qr_flutter: ^4.1.0
  remixicon: ^4.9.2
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  uuid: ^4.5.1
  webview_flutter: ^4.13.1
  # Direct, because the Android file chooser is an Android-only API:
  # AndroidWebViewController.setOnShowFileSelector is what makes the
  # console's image attachment button open a picker.
  webview_flutter_android: ^4.14.0
  http: ^1.1.0
  share_plus: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Read by the bundled-font contract test, which parses pubspec itself.
  yaml: ^3.1.3

# The Android launcher icon, and the README icon beside it, are derived from the
# canonical APERTURE geometry by tool/generate_android_launcher_icons.py. There
# is deliberately no flutter_launcher_icons configuration: it cannot express an
# opaque legacy tile and a transparent adaptive foreground from one source, and
# a stray run would overwrite the verified launcher resources.

flutter:
  uses-material-design: true
  generate: true

  assets:
    # OFL-1.1 requires the licence to travel with the font software, including
    # in a binary redistribution. Packaged, not merely committed.
    - assets/fonts/Inter-OFL.txt
    - assets/fonts/FiraCode-OFL.txt

  # Bundled, never fetched. google_fonts downloaded these from Google's servers
  # at first use, which made ordinary UI rendering depend on the network and on
  # a Google endpoint — unacceptable for a private-first app and disqualifying
  # for official F-Droid. Both families are SIL OFL 1.1; see
  # assets/fonts/README.md for the upstream releases and digests.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Inter-Black.ttf
          weight: 900
    - family: FiraCode
      fonts:
        - asset: assets/fonts/FiraCode-Regular.ttf
          weight: 400
        - asset: assets/fonts/FiraCode-SemiBold.ttf
          weight: 600

flutter_intl:
  enabled: true
